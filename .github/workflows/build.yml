name: Build Arena AI Desktop

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: |
          pip install pillow
          python3 scripts/generate-icon.py

      - name: Build packages
        run: npm run build
        env:
          GH_TOKEN: ""

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: arena-ai-linux-installers
          path: |
            dist/*.AppImage
            dist/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: |
          pip install pillow
          python3 scripts/generate-icon.py

      - name: Build Windows installers
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ""

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: arena-ai-windows-installers
          path: |
            dist/*.exe
