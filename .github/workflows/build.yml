name: Build Arena AI Desktop

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate icon
        run: |
          pip install pillow
          python3 scripts/generate-icon.py

      - name: Build packages
        run: npm run build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: arena-ai-linux-installers
          path: |
            dist/*.AppImage
            dist/*.deb
